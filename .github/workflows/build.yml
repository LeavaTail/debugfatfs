name: Build check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: armhf
            host: arm-linux-gnueabihf
            cross_package: crossbuild-essential-armhf
          - arch: arm64
            host: aarch64-linux-gnu
            cross_package: crossbuild-essential-arm64

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            make \
            gcc \
            pkg-config

      - name: Install cross compiler
        if: matrix.arch != 'amd64'
        run: sudo apt-get install -y ${{ matrix.cross_package }}

      - name: Bootstrap
        run: script/bootstrap.sh

      - name: Configure native build
        if: matrix.arch == 'amd64'
        run: ./configure CFLAGS="-Werror"

      - name: Configure cross build
        if: matrix.arch != 'amd64'
        run: ./configure CFLAGS="-Werror" --host=${{ matrix.host }}

      - name: Build
        run: make